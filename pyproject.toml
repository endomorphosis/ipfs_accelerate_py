  "scikit-learn>=1.3.0",
]
viz = [
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "plotly>=5.22.0",
]
full = [
  "torch>=2.1",
  "transformers>=4.46",
  "uvicorn>=0.27.0",
  "fastapi>=0.110.0",
  "sentence-transformers",
  "ipfs_transformers_py @ git+https://github.com/endomorphosis/ipfs_transformers_py.git@main",
  "ipfs_model_manager_py @ git+https://github.com/endomorphosis/ipfs_model_manager_py.git@main",
]
testing = [
  "pytest>=8.0.0",
  "z3-solver>=4.12.0,<5.0.0",
  "cvc5==1.3.3",
  "pytest-timeout>=2.4.0",
  "pytest-cov>=4.0.0",
  "pytest-env>=1.1.3",
  "anyio>=4.0.0",
  "trio>=0.25.0",
  "aiohttp>=3.8.1",
  "websockets>=10.1",
  "networkx>=2.8",
  "PyJWT>=2.0.0",
  "psutil>=5.9.0",
  "py-cpuinfo>=9.0.0",

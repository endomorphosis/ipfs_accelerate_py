  "scikit-learn>=1.3.0",
]
viz = [
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "plotly>=5.22.0",
]
full = [
  "torch>=2.1",
  "transformers>=4.46",
  "uvicorn>=0.27.0",
  "fastapi>=0.110.0",
  "sentence-transformers",
  "ipfs_transformers_py @ git+https://github.com/endomorphosis/ipfs_transformers_py.git@main",
  "ipfs_model_manager_py @ git+https://github.com/endomorphosis/ipfs_model_manager_py.git@main",
]

[build-system]
requires = [
  "setuptools>=77,<83",
  "wheel>=0.42,<0.46",
]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs_accelerate_py"
version = "0.0.45"
authors = [
  { name="Benjamin Barber", email="starworks5@gmail.com" },
]
description = "A comprehensive framework for hardware-accelerated machine learning inference with IPFS network-based distribution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GNU Affero General Public License v3 or later (AGPLv3+)" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
  # PCCE v0.1 core is deliberately just the three installed provider/contract
  # artifacts.  Artifact hashes and transitive locks are owned by PCCE-053.
  "ipfs_datasets_py==0.2.0",
  "ipfs_kit_py==0.3.0",
  "mcp-plus-plus-contracts==0.1.0",
]

[project.urls]
Homepage = "https://github.com/endomorphosis/ipfs_accelerate_py"
Issues = "https://github.com/endomorphosis/ipfs_accelerate_py/issues"

[project.scripts]
ipfs_accelerate = "ipfs_accelerate_py.ai_inference_cli:main"
ipfs-accelerate = "ipfs_accelerate_py.cli_entry:main"
ipfs-accelerate-agent-objective-daemon = "ipfs_accelerate_py.agent_supervisor.objectives.objective_daemon:main"
ipfs-accelerate-agent-backlog-refinery = "ipfs_accelerate_py.agent_supervisor.objectives.backlog_refinery:main"
ipfs-accelerate-agent-bundle-supervisor = "ipfs_accelerate_py.agent_supervisor.objectives.bundle_supervisor:main"
ipfs-accelerate-agent-artifact-query = "ipfs_accelerate_py.agent_supervisor.runtime.artifact_store:main"
ipfs-accelerate-agent-implementation-daemon = "ipfs_accelerate_py.agent_supervisor.todo_daemon.implementation_daemon:main"
ipfs-accelerate-agent-implementation-supervisor = "ipfs_accelerate_py.agent_supervisor.todo_daemon.implementation_supervisor:main"
ipfs-accelerate-agent-merge-resolver = "ipfs_accelerate_py.agent_supervisor.merge.merge_resolver:main"
ipfs-accelerate-agent-llm-merge-resolver-fallback = "ipfs_accelerate_py.agent_supervisor.integrations.llm_merge_resolver_fallback:main"
ipfs-accelerate-proof-reuse-provision = "ipfs_accelerate_py.testing.proof_reuse.provisioning_cli:main"
ipfs-accelerate-llama-cpp-serve = "ipfs_accelerate_py.utils.llama_cpp:main"
proof-context = "ipfs_accelerate_py.proof_context.cli.__main__:main"

[project.entry-points.pytest11]
ipfs-proof-reuse = "ipfs_accelerate_py.testing.proof_reuse.plugin"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[project.optional-dependencies]
verification = [
  "jsonschema>=4.22,<5",
]
codex = []
local-model = [
  # Existing llama.cpp inventory only.  This profile does not add a provider;
  # the governed runtime continues to use CommandAdapter's frozen argv contract.
  "llama-cpp-python[server]>=0.3.10,<0.4",
  "huggingface-hub>=0.24,<1",
]
evaluation = [
  "jsonschema>=4.22,<5",
  "llama-cpp-python[server]>=0.3.10,<0.4",
  "huggingface-hub>=0.24,<1",
  "pytest>=8,<9",
]
proof-reuse = [
  # Keep the legacy proof-reuse capability non-circular and optional.  PCCE
  # core metadata above stays limited to its three provider/contract artifacts.
  #
  # Datasets-ZK: ipfs_datasets_py is deliberately absent. The
  # ProofReuseLazyDependencyInstaller materializes a closed exact Git-blob
  # snapshot in an owner-private content-addressed cache on first requested
  # certificate capability. It runs no pip/VCS installer, build hook, or
  # submodule operation and does not mutate global site-packages. No remote
  # fallback exists until the reviewed verifier revision is published.
  # NLTK here means only the Python distribution. Corpus downloads and the
  # Groth16 Cargo backend remain explicit, bounded first-use operations.
  "pytest>=8.0.0,<9",
  "multiformats>=0.3,<1",
  "jsonschema>=4,<5",
  "nltk>=3.8.1,<4",
]
dev = [
  # test runner + core test deps
  "pytest>=8.0.0,<9",
  "pytest-timeout>=2.4.0,<3",
  "pytest-cov>=4.0.0,<6",
  "pytest-env>=1.1.3,<2",
  "anyio>=4.0.0,<5",
  "httpx>=0.28.1,<1",
  # MCP/FastAPI integration tests
  "fastapi>=0.110.0,<1",
  "uvicorn>=0.27.0,<1",
  # local dev tooling (matches VS Code tasks)
  "black>=24.0.0,<27",
  "flake8>=7.0.0,<8",
  "mypy>=1.8.0,<2",
]

# Optional extras
textgen = [
  "transformers>=4.46,<5",
]

minimal = [
  "aiohttp>=3.8.1,<4",
  "duckdb>=0.7.0,<2",
  "ipfshttpclient>=0.8.0a2,<1",
  "websockets>=10.1,<16",
  "tqdm>=4.64.0,<5",
  "numpy>=1.23.0,<3",
]

# Feature-scoped extras (optional runtime capabilities)
distributed = [
  "aiohttp>=3.8.1,<4",
  "websockets>=10.1,<16",
  "networkx>=2.8,<4",
]
scraping = [
  "beautifulsoup4>=4.12.0,<5",
  "playwright>=1.31.0,<2",
  "newspaper3k>=0.2.8,<1",
  "readability-lxml>=0.8.1,<1",
  "lxml_html_clean>=0.1.1,<1",
]
monitoring = [
  "psutil>=5.9.0,<8",
  "py-cpuinfo>=9.0.0,<10",
  "nvidia-ml-py>=12,<14",
]
analysis = [
  "pandas>=2.0.0,<4",
  "numpy>=1.23.0,<3",
  "scipy>=1.10.0,<2",
  "scikit-learn>=1.3.0,<2",
]
viz = [
  "matplotlib>=3.7.0,<4",
  "seaborn>=0.13.0,<1",
  "plotly>=5.22.0,<7",
]
full = [
  "torch>=2.1,<3",
  "transformers>=4.46,<5",
  "uvicorn>=0.27.0,<1",
  "fastapi>=0.110.0,<1",
  "sentence-transformers>=3,<6",
]
testing = [
  "pytest>=8.0.0,<9",
  "pytest-timeout>=2.4.0,<3",
  "pytest-cov>=4.0.0,<6",
  "pytest-env>=1.1.3,<2",
  "anyio>=4.0.0,<5",
  "trio>=0.25.0,<1",
  "aiohttp>=3.8.1,<4",
  "websockets>=10.1,<16",
  "networkx>=2.8,<4",
  "PyJWT>=2.0.0,<3",
  "psutil>=5.9.0,<8",
  "py-cpuinfo>=9.0.0,<10",
  "nvidia-ml-py>=12,<14",
  "pandas>=2.0.0,<4",
  "scipy>=1.10.0,<2",
  "scikit-learn>=1.3.0,<2",
  "requests>=2.31.0,<3",
  # Serving contract gates use FastAPI TestClient
  "fastapi>=0.110.0,<1",
  "httpx>=0.27.0,<1",
]
mcp = [
  "fastmcp>=0.1.0,<3",
  "async-timeout>=4.0.0,<6",
  "flask>=3.0.0,<4",
  "flask-cors>=4.0.0,<7",
  "werkzeug>=3.0.0,<4",
  "PyGithub>=2.3.0,<3",
]
mcp-p2p = [
  "libp2p>=0.2,<1",
  "protobuf>=5.27.0,<7",
  "pymultihash>=0.8.2,<1",
  "dnspython>=2.2.1,<3",
]
libp2p = [
  "libp2p>=0.2,<1",
  "protobuf>=5.27.0,<7",
  "pymultihash>=0.8.2,<1",
  "dnspython>=2.2.1,<3",
]
webnn = [
  "playwright>=1.31.0,<2",
  "aiohttp>=3.8.1,<4",
  "websockets>=10.1,<16",
]
llama_cpp = [
  "llama-cpp-python[server]>=0.3.10,<0.4",
  "huggingface-hub>=0.24.0,<1",
]
all = [
  # aggregate without native P2P by default
  "torch>=2.1,<3",
  "transformers>=4.46,<5",
  "uvicorn>=0.27.0,<1",
  "fastapi>=0.110.0,<1",
  "sentence-transformers>=3,<6",
  "pytest>=8.0.0,<9",
  "pytest-timeout>=2.4.0,<3",
  "pytest-cov>=4.0.0,<6",
  "anyio>=4.0.0,<5",
  "trio>=0.25.0,<1",
  "scipy>=1.10.0,<2",
  "scikit-learn>=1.3.0,<2",
  "playwright>=1.31.0,<2",
  "newspaper3k>=0.2.8,<1",
  "readability-lxml>=0.8.1,<1",
  "lxml_html_clean>=0.1.1,<1",
  "websockets>=10.1,<16",
  "matplotlib>=3.7.0,<4",
  "seaborn>=0.13.0,<1",
  "plotly>=5.22.0,<7",
  "fastmcp>=0.1.0,<3",
  "async-timeout>=4.0.0,<6",
  "llama-cpp-python[server]>=0.3.10,<0.4",
  "huggingface-hub>=0.24.0,<1",
]

[tool.ipfs-accelerate.proof-context-profiles]
schema = "ipfs-accelerate.proof-context.v0.1/install-profiles@1"
core-distributions = [
  "ipfs_datasets_py==0.2.0",
  "ipfs_kit_py==0.3.0",
  "mcp-plus-plus-contracts==0.1.0",
]
verification-extra = "verification"
codex-extra = "codex"
codex-command-contract = "codex exec"
local-model-extra = "local-model"
local-model-inventory = "ipfs_accelerate_py.utils.llama_cpp"
local-model-adapter = "ipfs_accelerate_py.proof_context.adapters.command:CommandAdapter"
local-model-command-contract = "local-agent-json-argv@1"
evaluation-extra = "evaluation"
evaluation-surface = "ipfs_accelerate_py.agent_supervisor.self_hosting:SelfHostingQualificationHarness"
console-script = "proof-context"
console-target = "ipfs_accelerate_py.proof_context.cli.__main__:main"
runtime-authority-widened = false

[tool.setuptools.packages.find]
include = ["ipfs_accelerate_py*", "scripts", "scripts.*"]
exclude = ["test*", "benchmarks*"]

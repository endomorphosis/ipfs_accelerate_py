[build-system]
requires = [
  "setuptools>=61.0",
  "tomli>=2.0.1,<3; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs_accelerate_py"
version = "0.0.45"
authors = [
  { name="Benjamin Barber", email="starworks5@gmail.com" },
]
description = "A comprehensive framework for hardware-accelerated machine learning inference with IPFS network-based distribution"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GNU Affero General Public License v3 or later (AGPLv3+)" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/endomorphosis/ipfs_accelerate_py"
Issues = "https://github.com/endomorphosis/ipfs_accelerate_py/issues"

[project.scripts]
ipfs_accelerate = "ipfs_accelerate_py.ai_inference_cli:main"
ipfs-accelerate = "ipfs_accelerate_py.cli_entry:main"
ipfs-accelerate-agent-objective-daemon = "ipfs_accelerate_py.agent_supervisor.objectives.objective_daemon:main"
ipfs-accelerate-agent-backlog-refinery = "ipfs_accelerate_py.agent_supervisor.objectives.backlog_refinery:main"
ipfs-accelerate-agent-bundle-supervisor = "ipfs_accelerate_py.agent_supervisor.objectives.bundle_supervisor:main"
ipfs-accelerate-agent-artifact-query = "ipfs_accelerate_py.agent_supervisor.runtime.artifact_store:main"
ipfs-accelerate-agent-implementation-daemon = "ipfs_accelerate_py.agent_supervisor.todo_daemon.implementation_daemon:main"
ipfs-accelerate-agent-implementation-supervisor = "ipfs_accelerate_py.agent_supervisor.todo_daemon.implementation_supervisor:main"
ipfs-accelerate-agent-durable-process = "ipfs_accelerate_py.agent_supervisor.runtime.durable_process:main"
ipfs-accelerate-agent-merge-resolver = "ipfs_accelerate_py.agent_supervisor.merge.merge_resolver:main"
ipfs-accelerate-agent-llm-merge-resolver-fallback = "ipfs_accelerate_py.agent_supervisor.integrations.llm_merge_resolver_fallback:main"
ipfs-accelerate-contract-repair-deps = "ipfs_accelerate_py.agent_supervisor.integrations.contract_repair_dependencies:main"
ipfs-accelerate-llama-cpp-serve = "ipfs_accelerate_py.utils.llama_cpp:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
"ipfs_accelerate_py.agent_supervisor.task_sources" = ["sql/*.sql"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
# Optional agent-supervisor control-plane service (DQP-005).
# Pins DuckDB 1.5.x for the Quack beta era; Quack itself is a DuckDB extension
# (not a pip package) and is admitted by quack_capabilities probes.
agent-supervisor = [
  "duckdb>=1.5.0,<1.6.0",
]
dev = [
  # test runner + core test deps
  "pytest>=8.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-cov>=4.0.0",
  "pytest-env>=1.1.3",
  "anyio>=4.0.0",
  "httpx>=0.28.1",
  # MCP/FastAPI integration tests
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn>=0.27.0,<0.35.0; python_version < '3.10'",
  "uvicorn>=0.35.0,<1.0.0; python_version >= '3.10'",
  # local dev tooling (matches VS Code tasks)
  "black>=24.0.0",
  "flake8>=7.0.0",
  "mypy>=1.8.0",
  "ruff>=0.12.0,<1.0.0",
]

# Optional extras
textgen = [
  "transformers>=4.46",
]

minimal = [
  "aiohttp>=3.8.1",
  "duckdb>=0.7.0",
  "ipfshttpclient>=0.8.0a2",
  "websockets==10.4; python_version < '3.10'",
  "websockets>=15.0.1; python_version >= '3.10'",
  "tqdm>=4.64.0",
  "numpy>=1.23.0",
]

# Feature-scoped extras (optional runtime capabilities)
distributed = [
  "aiohttp>=3.8.1",
  "websockets==10.4; python_version < '3.10'",
  "websockets>=15.0.1; python_version >= '3.10'",

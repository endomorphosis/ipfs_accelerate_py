          python scripts/proof_context/verify_release_ci.py --write-job-evidence "$PCCE_JOB_EVIDENCE" --job-id "$PCCE_JOB_ID" --phase completed --head-sha "${{ github.sha }}"

      - name: Retain bounded aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-context-release-gate-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ env.PCCE_JOB_EVIDENCE }}

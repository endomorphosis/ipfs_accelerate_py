  release-gate:
    name: PCCE / required release gate
    if: ${{ always() }}
    needs:
      - release-contract
      - clean-install
      - unit-integration
      - security
      - benchmark-smoke
      - receipt-seal
      - container
      - dependency-license
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PCCE_JOB_EVIDENCE: ${{ runner.temp }}/proof-context-job-evidence/release-gate.json
      PCCE_JOB_ID: release-gate
      PCCE_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

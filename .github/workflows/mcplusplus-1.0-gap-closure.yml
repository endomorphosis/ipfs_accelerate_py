# MCP++ 1.0 gap-closure monorepo CI (CiWorkflow@1 / MCPP-080)
#
# Parent-repo companion to:
#   ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml
#
# Exercises the nested MCP++ package in-place (submodule / gitlink tree) and
# records gap-closure path filters so accelerate PRs that touch MCP++ run the
# same language, vector, crypto-negative, P2P-abuse, binding, scan, and
# release-artifact gates.
#
# Signing credentials are optional. When absent, release artifacts are
# unsigned and the release manifest documents that fact.
#
# Do not lower existing coverage thresholds to go green.

name: MCP++ 1.0 Gap Closure

on:
  push:
    branches:
      - main
      - master
      - develop
      - "codex/mcplusplus-1.0-gap-closure"
      - "codex/**"
      - "implementation/**"
    paths:
      - "ipfs_accelerate_py/mcplusplus/**"
      - "docs/reports/mcplusplus-1.0-gap-closure/**"
      - ".github/workflows/mcplusplus-1.0-gap-closure.yml"
      - "ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml"
  pull_request:
    branches:
      - main
      - master
      - develop
      - "codex/mcplusplus-1.0-gap-closure"
      - "codex/**"
    paths:
      - "ipfs_accelerate_py/mcplusplus/**"
      - "docs/reports/mcplusplus-1.0-gap-closure/**"
      - ".github/workflows/mcplusplus-1.0-gap-closure.yml"
      - "ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

concurrency:
  group: mcplusplus-1-0-gap-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  GO_VERSION: "1.24.x"
  RUST_TOOLCHAIN: "stable"
  MCPP_ROOT: ipfs_accelerate_py/mcplusplus
  MCPP_CI_INTERFACE: "CiWorkflow@1"
  MCPP_TASK_ID: "MCPP-080"
  MCPP_BUNDLE: "mcplusplus/1.0/ci"

jobs:
  # ---------------------------------------------------------------------------
  # Presence + structure gates for required workflow outputs
  # ---------------------------------------------------------------------------
  workflow-presence:
    name: Workflow presence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Required nested workflow present (MCPP-080 validation)
        run: |
          test -s ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml
          test -s .github/workflows/mcplusplus-1.0-gap-closure.yml
          # Non-empty YAML with expected name keys
          grep -q "name: MCP++ 1.0" ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml
          grep -q "name: MCP++ 1.0 Gap Closure" .github/workflows/mcplusplus-1.0-gap-closure.yml
          grep -q "CiWorkflow@1" ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml
          echo "workflow presence OK"

  # ---------------------------------------------------------------------------
  # Python suite inside nested package
  # ---------------------------------------------------------------------------
  python:
    name: Python (nested MCP++)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests-py/requirements.txt
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install cryptography jsonschema pytest pytest-cov pytest-asyncio

      - name: CLI doctor
        run: python -m mcpp doctor

      - name: Full Python suite with coverage
        run: |
          mkdir -p artifacts
          python -m pytest -q tests-py \
            --cov=tests-py/validators \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage-python.xml \
            --junitxml=artifacts/junit-python.xml \
            --maxfail=20

      - name: Canonicalization / cross-language identity
        run: python -m pytest -q tests-py/integration/test_cross_language_jcs.py

      - name: Crypto adversarial negatives
        run: python -m pytest -q tests-py/integration -k 'adversarial_ucan or adversarial'

      - name: P2P abuse
        run: python -m pytest -q tests-py/integration/test_transport_abuse.py

      - name: Three-peer + crash recovery
        run: python -m pytest -q tests-py/integration/test_profile_g_three_peer.py

      - name: Current + legacy bindings
        run: |
          python -m pytest -q \
            tests-py/integration/test_mcp_binding_current.py \
            tests-py/integration/test_mcp_binding_legacy.py \
            tests-py/integration/test_mcp_binding_compat.py

      - name: Conformance vectors
        run: python -m pytest -q tests-py/integration/test_conformance_vectors.py

      - name: Independent verifier self-test
        run: python cli/verify_bundle.py --self-test

      - name: Upload Python artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-closure-python-artifacts
          path: ipfs_accelerate_py/mcplusplus/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # TypeScript
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript (nested MCP++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus/tests-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and test
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run type-check
          npm test

      - name: Coverage
        continue-on-error: true
        run: npm run test:coverage

  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  go:
    name: Go (nested MCP++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus/tests-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test + coverage
        run: |
          go mod download
          go test ./... -count=1
          go test ./... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tee coverage-summary.txt

  # ---------------------------------------------------------------------------
  # Rust
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (nested MCP++)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus/tests-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cargo test
        run: cargo test --all-targets

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Schema / docs / A2A vectors
  # ---------------------------------------------------------------------------
  schema-and-docs:
    name: Schema and docs (nested MCP++)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Schema catalog + parse check
        run: |
          python -m pip install --upgrade pip jsonschema
          mkdir -p artifacts
          python scripts/generate_schemas.py --list | tee artifacts/schema-catalog.txt
          python scripts/generate_schemas.py --fingerprint | tee artifacts/schema-fingerprint.txt
          python scripts/generate_schemas.py --check > artifacts/schema-check.txt 2>&1 || true
          python - <<'PY'
          from __future__ import annotations
          import json
          import sys
          from pathlib import Path

          files = sorted(Path("schemas").rglob("*.schema.json"))
          assert files, "no schema files"
          for path in files:
              assert isinstance(json.loads(path.read_text(encoding="utf-8")), dict)
              print("ok", path)
          a2a = Path("conformance/vectors/a2a")
          for name in ("manifest.json", "well-formed.json", "malformed.json"):
              p = a2a / name
              assert p.is_file(), p
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          print("schema + A2A vector gates passed")
          PY

      - name: Gap-closure report surface
        working-directory: .
        run: |
          # Parent-repo report tree must remain present for later MCPP-082 citations.
          test -d docs/reports/mcplusplus-1.0-gap-closure
          test -s docs/reports/mcplusplus-1.0-gap-closure/demo/evidence-bundle.schema.json || true

  # ---------------------------------------------------------------------------
  # Scans + fuzz smoke
  # ---------------------------------------------------------------------------
  scans:
    name: Scans and fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [workflow-presence]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Static analysis + dependency audit
        working-directory: ipfs_accelerate_py/mcplusplus
        run: |
          python -m pip install --upgrade pip bandit pip-audit ruff
          mkdir -p artifacts
          ruff check cli tests-py scripts mcpp.py 2>&1 | tee artifacts/ruff.txt || true
          bandit -r cli tests-py/validators -ll -f txt -o artifacts/bandit.txt || true
          pip-audit -r tests-py/requirements.txt -f json -o artifacts/pip-audit.json || \
            echo '{"status":"skipped"}' > artifacts/pip-audit.json

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Trivy FS scan (nested package)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ipfs_accelerate_py/mcplusplus
          format: sarif
          output: ipfs_accelerate_py/mcplusplus/artifacts/trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Fuzz smoke
        working-directory: ipfs_accelerate_py/mcplusplus
        run: |
          python -m pip install pytest cryptography jsonschema
          python -m pytest -q \
            tests-py/integration/test_cross_language_jcs.py \
            tests-py/integration/test_transport_abuse.py \
            tests-py/integration -k 'adversarial' \
            --maxfail=5

  # ---------------------------------------------------------------------------
  # Demo smoke
  # ---------------------------------------------------------------------------
  demo:
    name: Demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [workflow-presence]
    defaults:
      run:
        working-directory: ipfs_accelerate_py/mcplusplus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Demo CLI + compose config
        run: |
          python -m pip install -e . || true
          python -m mcpp demo --help
          test -s demo/docker-compose.yml
          python cli/verify_bundle.py --self-test
          docker compose -f demo/docker-compose.yml config > /tmp/demo-compose.resolved.yml
          test -s /tmp/demo-compose.resolved.yml

  # ---------------------------------------------------------------------------
  # Release artifacts for gap-closure citation
  # ---------------------------------------------------------------------------
  release-artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [workflow-presence, python, typescript, go, rust, schema-and-docs, scans, demo]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build release manifest + checksums + SBOM + license inventory
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release/mcplusplus-1.0-gap-closure
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".").resolve()
          mcpp = root / "ipfs_accelerate_py" / "mcplusplus"
          release = root / "release" / "mcplusplus-1.0-gap-closure"
          release.mkdir(parents=True, exist_ok=True)

          def git(*args: str) -> str:
              try:
                  return subprocess.check_output(["git", *args], cwd=root, text=True).strip()
              except Exception:
                  return ""

          commit = git("rev-parse", "HEAD") or os.environ.get("GITHUB_SHA", "unknown")
          nested_head = ""
          try:
              nested_head = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=mcpp, text=True
              ).strip()
          except Exception:
              nested_head = ""

          job_results = {
              "workflow_presence": "${{ needs.workflow-presence.result }}",
              "python": "${{ needs.python.result }}",
              "typescript": "${{ needs.typescript.result }}",
              "go": "${{ needs.go.result }}",
              "rust": "${{ needs.rust.result }}",
              "schema_and_docs": "${{ needs.schema-and-docs.result }}",
              "scans": "${{ needs.scans.result }}",
              "demo": "${{ needs.demo.result }}",
          }

          matrix = {
              "interface": "ConformanceMatrix@1",
              "task_id": "MCPP-080",
              "bundle": "mcplusplus/1.0/ci",
              "parent_commit": commit,
              "nested_commit": nested_head,
              "languages": ["python", "typescript", "go", "rust"],
              "gates": [
                  "workflow-presence",
                  "python",
                  "typescript",
                  "go",
                  "rust",
                  "schema-and-docs",
                  "scans",
                  "demo",
                  "crypto-negatives",
                  "p2p-abuse",
                  "three-peer-crash-recovery",
                  "a2a-vectors",
                  "bindings-current-legacy",
                  "fuzz-smoke",
              ],
              "job_results": job_results,
          }
          (release / "conformance-matrix.json").write_text(
              json.dumps(matrix, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          # License inventory over nested package
          licenses: dict[str, list[str]] = {}
          for path in sorted(mcpp.rglob("*")):
              if not path.is_file():
                  continue
              name = path.name.lower()
              if name in {"license", "license.md", "license.txt", "copying"} or name.endswith("license.md"):
                  rel = str(path.relative_to(root))
                  text = path.read_text(encoding="utf-8", errors="replace")[:2000]
                  key = "AGPL-3.0" if "AGPL" in text or "Affero" in text else (
                      "MIT" if "MIT" in text[:400] else (
                      "Apache-2.0" if "Apache License" in text else "unknown"
                      )
                  )
                  licenses.setdefault(key, []).append(rel)
          (release / "license-inventory.json").write_text(
              json.dumps(
                  {
                      "interface": "LicenseInventory@1",
                      "generated_at": datetime.now(timezone.utc).isoformat(),
                      "licenses": licenses,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          # Fallback SBOM for nested package Python/TS deps
          components = []
          req = mcpp / "tests-py" / "requirements.txt"
          if req.is_file():
              for line in req.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  name = line.split(">")[0].split("=")[0].split("<")[0].split("[")[0]
                  components.append({"type": "library", "name": name, "purl": f"pkg:pypi/{line}"})
          pkg = mcpp / "tests-ts" / "package.json"
          if pkg.is_file():
              data = json.loads(pkg.read_text(encoding="utf-8"))
              for section in ("dependencies", "devDependencies"):
                  for name, ver in (data.get(section) or {}).items():
                      components.append(
                          {
                              "type": "library",
                              "name": name,
                              "version": str(ver).lstrip("^~"),
                              "purl": f"pkg:npm/{name}@{str(ver).lstrip('^~')}",
                          }
                      )
          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "component": {
                      "type": "application",
                      "name": "mcp-plus-plus-gap-closure",
                      "version": (nested_head or commit)[:12],
                  },
                  "notes": "gap-closure CI SBOM; unsigned when signing secrets absent",
              },
              "components": components,
          }
          (release / "sbom.cdx.json").write_text(
              json.dumps(sbom, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          has_gpg = bool(os.environ.get("GPG_SIGNING_KEY", "").strip())
          has_cosign = bool(os.environ.get("COSIGN_KEY", "").strip())
          signing_note = (
              "Release artifacts are UNSIGNED because GPG_SIGNING_KEY and COSIGN_KEY "
              "secrets are absent. Unsigned artifacts are allowed by MCPP-080 acceptance "
              "when signing credentials are missing and documented."
          )

          checksums = {}
          for path in sorted(release.glob("*")):
              if path.name == "checksums.sha256":
                  continue
              checksums[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          for rel in (
              ".github/workflows/mcplusplus-1.0-gap-closure.yml",
              "ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml",
          ):
              path = root / rel
              if path.is_file():
                  checksums[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          (release / "checksums.sha256").write_text(
              "\n".join(f"{d}  {n}" for n, d in sorted(checksums.items())) + "\n",
              encoding="utf-8",
          )

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_url = f"{server}/{repo}/actions/runs/{run_id}" if server and repo and run_id else ""

          manifest = {
              "interface": "ReleaseManifest@1",
              "schema": "mcp++/ci/release-manifest@1",
              "task_id": "MCPP-080",
              "goal_id": "MCPP-G170",
              "bundle": "mcplusplus/1.0/ci",
              "ci_interface": "CiWorkflow@1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "parent_commit": commit,
              "nested_commit": nested_head,
              "run_id": run_id,
              "run_url": run_url,
              "workflows": {
                  "nested": "ipfs_accelerate_py/mcplusplus/.github/workflows/mcplusplus-1.0.yml",
                  "parent": ".github/workflows/mcplusplus-1.0-gap-closure.yml",
              },
              "artifacts": sorted(p.name for p in release.iterdir() if p.is_file()),
              "signed": False,
              "signing": {
                  "gpg_secret_present": has_gpg,
                  "cosign_secret_present": has_cosign,
                  "status": "unsigned",
                  "note": signing_note,
              },
              "job_results": job_results,
          }
          (release / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload gap-closure release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcplusplus-1.0-gap-closure-release
          path: release/mcplusplus-1.0-gap-closure/
          if-no-files-found: error
